name: Import reviewed P4 integration
on:
  push:
    branches: [build/coffee-demo-media]
    paths: [.p4-import.ready]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply exact integration diff on feature branch only
        run: |
          git merge-base --is-ancestor eba7e1c029c873dc874f1412cd490364cdbfadaa HEAD
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          raw=pathlib.Path('.p4-integration.patch').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='8aa0e0fab8e441ed8b2a438b1b407fdb091b71b6cd92d1c0d6b687e92ec55661'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          pathlib.Path('.p4-integration.patch').unlink()
          pathlib.Path('.p4-import.ready').unlink()
          PY
          git add -u
          git -c user.name='P4 integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate data-only media delivery with the existing Linux host'
          git push origin HEAD:build/coffee-demo-media
