name: F3 Layout Style Theme
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  layout-style:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install ARM functional tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Layout
        run: make test-layout
      - name: Style
        run: make test-style
      - name: Theme
        run: make test-theme
      - name: Dual viewport golden
        run: make test-layout-golden
      - name: Machine-readable schema boundary
        run: make test-ui-schema
      - name: ARM Cortex-A7 semantic parity
        run: make test-ui-platform-arm
