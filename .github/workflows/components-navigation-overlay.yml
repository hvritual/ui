name: F4 Components Navigation Overlay
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install ARM functional tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Standard components
        run: make test-components
      - name: Navigation stack
        run: make test-navigation
      - name: Overlay manager
        run: make test-overlay
      - name: Coffee semantic migration
        run: make test-coffee-component-migration
      - name: ARM Cortex-A7 parity
        run: make test-components-arm
