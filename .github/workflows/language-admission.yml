name: Language Admission Evidence
on:
  pull_request:
    branches: [main, feat/visible-pinyin-keyboard]
    paths: ['contracts/language-release*.json', 'scripts/language*.py', 'scripts/language.mk', 'tests/language/**', '.github/workflows/language-admission.yml']
  push:
    branches: [main]
    paths: ['contracts/language-release*.json', 'scripts/language*.py', 'scripts/language.mk', 'tests/language/**', '.github/workflows/language-admission.yml']
permissions:
  contents: read
  actions: read
jobs:
  language:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate language declarations and negative guards
        run: |
          python3 -m unittest discover -s tests/language -v
          python3 scripts/language_admission.py check
      - name: Checkout immutable runtime evidence source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 882fb7bf872308a78bdc6246f0124643144ea299
          path: out/language-baseline
          persist-credentials: false
      - name: Install review tools without rebuilding the Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasan6 libubsan1 libc6-dev-armhf-cross
          python3 -m pip install Pillow==11.3.0 fonttools==4.59.0
      - name: Download digest-bound evidence and independently rerun original binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/language_evidence.py --policy contracts/language-release.json --baseline out/language-baseline --output out/language/evidence.json --download --rerun
      - name: Bind current implementation and generate one-source language reports
        run: |
          python3 scripts/language_admission.py accept --evidence out/language/evidence.json --baseline out/language-baseline --framework out/language-baseline/out/framework --output out/language
          git diff --exit-code
          git rev-parse HEAD > out/language/checker-commit.txt
          git archive HEAD > out/language/checker-source.tar
      - name: Preserve complete raw review logs without copying fonts or packages
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          output = pathlib.Path('out/language')
          delivery = pathlib.Path('out/language-delivery')
          delivery.mkdir()
          root = pathlib.Path('out/language-baseline/out/framework/language-independent-rerun')
          receipt = json.loads((output/'evidence.json').read_text())
          for name in ('admission.json','support.md','evidence.json','checker-commit.txt','checker-source.tar'):
              assert (output/name).is_file() and not (output/name).is_symlink()
              shutil.copyfile(output/name, delivery/name)
          copied = set()
          for relative, expected in receipt['independent_rerun']['raw_logs'].items():
              path = root/relative
              assert path.is_file() and not path.is_symlink()
              assert path.suffix == '.log' and '..' not in pathlib.PurePosixPath(relative).parts
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
              destination = delivery/'rerun'/relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              copied.add(relative)
          assert len(copied) >= 100, 'incomplete production/view review logs'
          for mode in ('native','arm'):
              for suffix in ('-proof.json','-legacy-proof.json'):
                  source = root/(mode+suffix)
                  assert source.is_file() and not source.is_symlink()
                  shutil.copyfile(source, delivery/'rerun'/source.name)
          for path in delivery.rglob('*'):
              if path.is_file():
                  assert path.suffix in ('.json','.md','.txt','.tar','.log'), 'unapproved review artifact member'
          print('COMPLETE_REVIEW_LOGS', len(copied), 'proofs=4 no-font-or-package')
          PY
          (cd out/language-delivery && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload reports, checker source and complete synthetic review logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/language-delivery/
          if-no-files-found: warn
          retention-days: 90
