name: F2 UI Object Model
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui-object:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install ARM functional tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Object model
        run: make test-ui-object-model
      - name: Lifecycle/event/queue
        run: make test-ui-lifecycle
      - name: Dirty/engine ownership
        run: make test-ui-dirty
      - name: ARM object-model suite
        run: make test-ui-object-arm
